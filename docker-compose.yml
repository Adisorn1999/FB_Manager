version: '3.9'

services:

  frontend:
    build: ./frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

  backend:
    build: ./backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - mysql

    restart: always

  mysql:
    image: mysql:5.7

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: fb_manager

    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    restart: always

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql

    depends_on:
      - mysql